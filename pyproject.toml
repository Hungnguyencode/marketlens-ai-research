[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-first-market-research"
version = "0.1.0"
description = "Bounded evidence-first market research engine"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
dashboard = ["streamlit>=1.55,<2", "altair>=5.4,<7", "pandas>=2.2,<4"]
dashboard-test = ["vl-convert-python>=1.9,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"

[tool.setuptools]
packages = ["market_research"]
