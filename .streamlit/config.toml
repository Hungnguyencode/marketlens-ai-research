[theme]
base = "light"
primaryColor = "#3276E8"
backgroundColor = "#F5F7FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#132238"
font = "sans serif"
baseFontSize = 16
headingFontSizes = ["2.25rem", "1.5rem", "1.125rem"]
headingFontWeights = [750, 700, 650]
baseRadius = "medium"
borderColor = "#E4EBF3"

[theme.sidebar]
primaryColor = "#61C7C0"
backgroundColor = "#0C1B2F"
secondaryBackgroundColor = "#162A43"
textColor = "#DCE7F3"
borderColor = "#29405C"
linkColor = "#88B6FF"

[browser]
gatherUsageStats = false

[server]
address = "127.0.0.1"
headless = true
